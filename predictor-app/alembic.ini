# A generic, single database configuration.

[alembic]
# Path to migration scripts.
# Using %(here)s means: "look in the same folder as this .ini file"
script_location = %(here)s/migrations

# sys.path path — use current folder
prepend_sys_path = .

# Database connection URL (this is used in env.py)
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/stocks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
